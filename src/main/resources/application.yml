database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:delivery}
  username: ${DB_USER:username}
  password: "${DB_PASSWORD:secret}"
  sslmode: ${DB_SSLMODE:disable}

kafka:
  bootstrap-servers: ${KAFKA_HOST:localhost:9092}
  consumer-group: ${KAFKA_CONSUMER_GROUP:delivery-group}
  auto-offset-reset: earliest

application:
  name: delivery

app:
  grpc:
    geo-service:
      host: ${GEO_SERVICE_GRPC_HOST:localhost}
      port: ${GEO_SERVICE_GRPC_PORT:5004}
  kafka:
    basket-events-topic: ${KAFKA_BASKET_EVENTS_TOPIC:basket.events}
    order-events-topic: ${KAFKA_ORDER_EVENTS_TOPIC:order.events}

server:
  port: ${HTTP_PORT:8082}
